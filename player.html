<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtream Baba</title>
    <link rel="stylesheet" href="css/player.css?v=3">
    <script src="js/hls.min.js?v=3"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="dots"><span class="dot green"></span><span class="dot red"></span></div>
                <span class="logo-text">XTREAM <b>BABA</b></span>
            </div>
            <div class="header-center" id="serverInfoText">Hosgeldiniz</div>
            <div class="header-right">
                <button class="icon-btn" id="themeBtn" title="Tema Degistir">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="icon-btn" id="favToggleBtn" title="Favoriler">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                </button>
                <span class="clock" id="clock"></span>
                <button class="icon-btn" id="settingsBtn" title="Ana Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
            </div>
        </header>

        <div class="main">
            <div class="video-col">
                <div class="tv-frame">
                        <div class="tv-screen">
                        <video id="videoPlayer" playsinline webkit-playsinline></video>
                        <div class="subtitle-display" id="subtitleDisplay"></div>
                        <div class="video-placeholder" id="videoPlaceholder">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <div class="video-controls" id="videoControls">
                            <button class="ctrl-btn" id="playPauseBtn" title="Durdur/Oynat (Space)">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="white" id="playPauseIcon"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <button class="ctrl-btn seek-btn" id="seekBackBtn" title="-10 sn (Left)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                                <span class="seek-label">10</span>
                            </button>
                            <button class="ctrl-btn seek-btn" id="seekFwdBtn" title="+10 sn (Right)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                                <span class="seek-label">10</span>
                            </button>
                            <div class="progress-wrap">
                                <div class="progress-bar" id="progressBar">
                                    <div class="progress-buffered" id="progressBuffered"></div>
                                    <div class="progress-fill" id="progressFill"></div>
                                </div>
                            </div>
                            <span class="time-text" id="timeDisplay">00:00 / 00:00</span>
                            <div class="vol-wrap">
                                <button class="ctrl-btn" id="muteBtn" title="Ses Ac/Kapa (M)">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white" id="volumeIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                                </button>
                                <input type="range" class="vol-slider" id="volumeSlider" min="0" max="100" value="100">
                            </div>
                            <button class="ctrl-btn" id="pipBtn" title="Picture in Picture (P)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
                            </button>
                            <button class="ctrl-btn" id="subBtn" title="Altyazi Yukle (S)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8z"/></svg>
                            </button>
                            <input type="file" id="subFileInput" accept=".srt,.vtt,.ass,.ssa" style="display:none">
                            <button class="ctrl-btn" id="subOffBtn" title="Altyaziyi Kapat" style="display:none">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19 4H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .5-.5 1-1 1H7c-.5 0-1-.5-1-1v-4c0-.5.5-1 1-1h3c.5 0 1 .5 1 1v1zm7-1h-1.5v.5h-2v-3h2V10H17v4c0 .5-.5 1-1 1h-3c-.5 0-1-.5-1-1v-1h1.5v.5h2v-3h-2V9H16V8c0-.5.5-1 1-1h3c.5 0 1 .5 1 1v4z"/></svg>
                            </button>
                            <button class="ctrl-btn" id="fullscreenBtn" title="Tam Ekran (F)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="now-playing" id="nowPlaying">
                    <div class="np-poster" id="npPoster">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="np-info">
                        <div class="np-name" id="currentChannelName">Bir kanal secin</div>
                        <div class="np-status" id="channelStatus"></div>
                        <div class="np-codec" id="np-codec-text"></div>
                    </div>
                    <div class="np-quality" id="qualityBadge" style="display:none">
                        <span class="q-label" id="qualityLabel">HD</span>
                        <span class="q-res" id="qualityRes">1280x720</span>
                    </div>
                    <div class="np-connection" id="connectionInfo">
                        <div class="conn-bar-wrap">
                            <div class="conn-bar" id="connBar"></div>
                        </div>
                        <span class="conn-speed" id="connSpeed">0 Mbps</span>
                    </div>
                </div>

                <div class="account-bar">
                    <div class="ab-item"><span class="ab-label">Kullanici</span><span class="ab-value" id="detailUsername">-</span></div>
                    <div class="ab-item"><span class="ab-label">Baslangic</span><span class="ab-value" id="detailStartDate">-</span></div>
                    <div class="ab-item"><span class="ab-label">Bitis</span><span class="ab-value" id="detailEndDate">-</span></div>
                    <div class="ab-item"><span class="ab-label">Baglanti</span><span class="ab-value" id="detailConnections">-</span></div>
                    <div class="ab-item"><span class="ab-label">Saat</span><span class="ab-value" id="detailServerTime">-</span></div>
                    <div class="ab-item"><span class="ab-label">Cihaz</span><span class="ab-value" id="detailDeviceId">HTML5</span></div>
                </div>
            </div>

            <div class="list-col">
                <div class="menu-tabs">
                    <button class="tab active" data-type="live">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>
                        Canli TV
                    </button>
                    <button class="tab" data-type="movies">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg>
                        Filmler
                    </button>
                    <button class="tab" data-type="series">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                        Diziler
                    </button>
                </div>

                <div class="search-bar">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="searchInput" placeholder="Kanal veya film ara..." autocomplete="off">
                    <button class="search-clear hidden" id="searchClear">&times;</button>
                </div>

                <div class="list-area">
                    <div class="cat-section" id="catSection">
                        <div class="section-label" id="sectionLabel">KATEGORILER</div>
                        <div class="cat-grid" id="categoriesList"></div>
                    </div>
                    <div class="ch-section" id="chSection" style="display:none">
                        <div class="section-header">
                            <button class="back-btn" id="backToCats">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                                Geri
                            </button>
                            <span class="section-label" id="chLabel">KANALLAR</span>
                        </div>
                        <div class="ch-list" id="channelsList"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-dot-small"></span>
            <span id="statusText">Hazir</span>
            <span class="status-separator">|</span>
            <span class="legal-status">Xtream Baba yalnizca bir IPTV oynaticisidir. Icerik saglamaz.</span>
        </div>
        <div class="pip-active-bar">
            <span>Picture in Picture Aktif</span>
            <button id="pipReturnBtn">Ana Ekrana Don</button>
        </div>
    </div>
    <script src="js/compat.js?v=3"></script>
    <script src="js/storage.js?v=3"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/player.js?v=3"></script>
    <script src="js/tvkeys.js?v=3"></script>
</body>
</html>
